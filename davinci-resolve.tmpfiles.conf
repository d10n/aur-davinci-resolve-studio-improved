# /usr/lib/tmpfiles.d/davinci-resolve-studio.conf
#
# DaVinci Resolve Studio stores its activation blob in /opt/resolve/.license/, so users need to write to the directory.
# Blackmagic's own installer handles this in scripts/post_install.sh by making files in /opt/resolve/ world-writable with 0777.
# root:davinci + setgid (2775) keeps root ownership, but grants write access to members of the 'davinci' group, and makes new files inherit that group.
# Add users with:
#     gpasswd -a <user> davinci
# (requires re-login to take effect)
#
# Spaces in paths must be escaped as \x20.
# Type  Path                                      Mode  Owner  Group    Age

#  Activation target.
d       /opt/resolve/.license                     2775  root   davinci  -

#  DDM package storage.
d       /opt/resolve/Extras                       2775  root   davinci  -

#  post_install.sh: create_config_files() LIST_OF_USER_FILES.
d       /opt/resolve/easyDCP                      2775  root   davinci  -
d       /opt/resolve/LUT                          2775  root   davinci  -
d       /opt/resolve/Apple\x20Immersive           2775  root   davinci  -

#  Resolve creates these at startup
d       /opt/resolve/Immersive                    2775  root   davinci  -
d       /opt/resolve/Fairlight                    2775  root   davinci  -
d       /opt/resolve/logs                         2775  root   davinci  -

#  COMMON_DATA_DIR.
d       /var/BlackmagicDesign                     0755  root   root     -
d       /var/BlackmagicDesign/DaVinci\x20Resolve  2775  root   davinci  -
